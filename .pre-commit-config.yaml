repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: vlsmkit-check
        name: generated files match network.toml
        entry: vlsmkit check
        language: system
        pass_filenames: false
        files: ^(network\.toml|src/|configs/|docs/generated/)
